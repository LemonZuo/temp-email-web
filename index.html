<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c10" />
    <meta name="description" content="Temp Email" />
    <title>Temp Email</title>
    <!-- Runtime config, e.g. {"API_BASE":"https://api.example.com"} — can be injected at deploy time -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <script id="app-config" type="application/json">{}</script>
    <script>
      // Set <html lang> before the first paint, in the order src/i18n resolveLocale uses (saved choice, runtime config,
      // build default, browser). With the initial "en", Safari offered to translate every Chinese page.
      try {
        var saved = (JSON.parse(localStorage.getItem('tm-prefs') || '{}').state || {}).locale
        var runtime = JSON.parse(document.getElementById('app-config').textContent || '{}').DEFAULT_LANG
        var build = '%VITE_DEFAULT_LANG%'
        var picks = [saved, runtime, build.charAt(0) === '%' ? '' : build, navigator.language]
        for (var i = 0; i < picks.length; i++) {
          var lang = String(picks[i] || '').toLowerCase()
          if (lang.indexOf('zh') === 0 || lang.indexOf('en') === 0) {
            document.documentElement.lang = lang.indexOf('zh') === 0 ? 'zh-CN' : 'en'
            break
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
