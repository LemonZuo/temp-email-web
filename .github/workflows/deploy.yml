name: Deploy

# Builds and deploys to Cloudflare Workers only when a version tag is pushed (or when run manually).
# Disconnect Cloudflare's own Git integration (Worker → Settings → Build), otherwise every push still deploys.
#
# Repository settings → Secrets and variables → Actions:
#   secrets:   CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID
#   variables: VITE_API_BASE (worker URL, e.g. https://mail-api.example.com)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check configuration
        run: |
          missing=""
          [ -n "$VITE_API_BASE" ] || missing="$missing VITE_API_BASE(variable)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing"
            exit 1
          fi
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Deploy ${{ github.ref_name }}
        run: npx --yes wrangler@4 deploy --tag "$GITHUB_REF_NAME" --message "$GITHUB_REF_NAME ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
